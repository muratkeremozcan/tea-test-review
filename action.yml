name: 'TEA Test Review'
description: |
  Runs the headless TEA test-quality review against a pull request's changed test
  files, fails the step on the review verdict, publishes the full report as a
  single upserted PR comment, and uploads the report and verdict JSON as a
  workflow-run artifact so they survive the runner.

  This packages cli/examples/pr-test-review.yml from
  bmad-method-test-architecture-enterprise into one step: pin and unpack the
  review skill from an npm tarball, install the pinned CLI and agent, run
  tea-test-review, then comment. Two jobs and ~230 lines of YAML per repository
  become one `uses:`.

  What it does not do, and why:

    - No fork coverage. Fork pull requests receive no secrets, so the review
      cannot run for them at all. Guard the job with an `if:` on the caller's
      side; see README.md, and read the fork caveat there before making this a
      required check.

  Zero dependencies: no node_modules to audit, no bundle step, and no
  third-party JavaScript between a pull request and the verdict that blocks it.
  The only actions it uses are GitHub's own setup-node, checkout and
  upload-artifact.

inputs:
  # ─── trigger ────────────────────────────────────────────────────────────────
  mode:
    description: |
      When the review runs. 'auto' (the default): every pull_request event,
      plus any comment containing a `prompt` mention when the workflow also
      triggers on issue_comment. 'manual': only a mention comment triggers the
      review; pull_request and every other event skip cleanly. A skip is exit
      0 with the `skipped` output set, never a failure.
    required: false
    default: 'auto'
  prompt:
    description: |
      Space-separated mention list that triggers the review from a PR comment,
      e.g. '@claude @codex'. Matching is exact and the first configured
      mention found in the comment wins. A mention naming a built-in vendor
      (@claude, @codex) selects that agent for the run; any other mention
      keeps the `agent` input. When the mention switches the agent, `model`
      and `agent-args` reset to the selected vendor's pinned defaults, because
      both are per-vendor and the configured values would not parse.

      Only a comment from an OWNER, MEMBER or COLLABORATOR — never a bot — can
      trigger the review. An issue_comment run executes with the base
      repository's secrets and checks out the PR's code, so this gate is what
      stands between a stranger and your API key on a public repository. Text
      after the mention is handed to the reviewer verbatim as a focus note
      (requires a tea-version whose CLI understands --focus).

      Requires the workflow to trigger on issue_comment, and the action's own
      checkout lands the PR's merge ref for those runs.
    required: false
    default: ''

  # ─── agent and credentials ──────────────────────────────────────────────────
  agent:
    description: |
      Which agent CLI executes the review. 'claude' and 'codex' are both proven
      by a live run and both natively supported by the review CLI's own adapter
      table (cli/lib/agent-adapters.js) — this action passes the value straight
      through as --agent.

      Any other value is treated as a custom vendor and needs agent-package, and
      usually agent-command and agent-key-env, so a new vendor is data you pass
      rather than a change to this action. The ceiling is not here though: a
      custom vendor runs by impersonating claude's protocol through --agent-cmd
      (the review CLI's own --agent only accepts claude, codex or none), so it
      has to accept claude's fixed argv (`-p --output-format text --tools ...
      --safe-mode`) and the prompt on stdin, or the run fails inside the CLI as
      an agent error. Prove a vendor with a live run before requiring it as a
      gate.
    required: false
    default: 'claude'
  anthropic-api-key:
    description: |
      Anthropic Console API key, pay-per-token. Passed to the agent as
      ANTHROPIC_API_KEY. Use this or claude-code-oauth-token, not both.

      May also be supplied through the step's own `env:` instead of here.
    required: false
    default: ''
  claude-code-oauth-token:
    description: |
      Long-lived token generated from an existing Claude subscription with
      `claude setup-token`, so the review bills against that subscription rather
      than a separate API account. Passed to the agent as
      CLAUDE_CODE_OAUTH_TOKEN.
    required: false
    default: ''
  openai-api-key:
    description: |
      OpenAI API key, pay-per-token, for `agent: codex`. Passed to the agent as
      OPENAI_API_KEY. `codex login` (stored under the runner's $HOME) works too;
      set this only when you want a service-account key instead of a login.

      May also be supplied through the step's own `env:` instead of here.
    required: false
    default: ''
  agent-api-key:
    description: |
      Credential for a custom vendor (one outside claude/codex), written into
      the environment variable named by agent-key-env. Ignored for claude and
      codex, which have their own dedicated inputs above.
    required: false
    default: ''
  agent-key-env:
    description: |
      Environment variable name that carries a custom vendor's credential, e.g.
      GEMINI_API_KEY. Also added to the review CLI's --env-pass allowlist, which
      is required: the CLI hands the agent a minimal environment and drops every
      name it was not told about. Not used for claude or codex.
    required: false
    default: ''
  agent-package:
    description: |
      npm spec for the agent CLI, version included, e.g. '@google/gemini-cli@0.5.0'.
      Required for a custom vendor. For 'claude' or 'codex' it overrides the
      package built from claude-code-version / codex-version.
    required: false
    default: ''
  agent-command:
    description: |
      Executable the review CLI spawns. Defaults to the agent's own name
      ('claude', 'codex', or a custom vendor's `agent` value). Passed through as
      --agent-cmd only when it differs from the resolved --agent value passed to
      the CLI.
    required: false
    default: ''
  model:
    description: |
      Model the review agent runs on, passed through as --model. Empty leaves
      the review CLI's own per-vendor pinned default (claude: sonnet, codex:
      gpt-5.6-sol), which is already deterministic — this input picks a
      different model, it does not decide whether one is pinned.

      Set it when the default tier is wrong for your suite, or pin a
      fully-qualified slug when a verdict has to be reproducible across model
      generations: the CLI's defaults are aliases that follow the vendor's
      current model in that tier.

      Requires a tea-version whose CLI understands --model; an older CLI fails
      with an unknown-option error. The model that actually ran is recorded in
      the verdict JSON as `model`.

      Note for custom vendors: the review CLI now includes a model flag in the
      fixed argv it hands the agent, so a wrapper impersonating claude's
      protocol under --agent-cmd has to tolerate `--model <value>` along with
      the rest of that argv.
    required: false
    default: ''
  agent-args:
    description: |
      Shell-style argument list passed directly to the selected agent through
      the review CLI's repeated --agent-arg option. Use this for vendor-specific
      execution settings such as Codex `-c model_reasoning_effort=low`.

      Requires a tea-version whose CLI understands --agent-arg. Arguments keep
      their declared order and are forwarded to whichever agent is selected.
    required: false
    default: ''

  # ─── pinned versions ────────────────────────────────────────────────────────
  tea-version:
    description: |
      Version or dist-tag of bmad-method-test-architecture-enterprise supplying
      both the CLI and the review skill. Defaults to `latest`, which tracks the
      newest published release.

      Pin an exact version when you need a reproducible verdict: this is the
      reviewer's control plane, and `latest` means whatever resolves on the day
      a pull request lands.

      It has to be a version that ships the tea-test-review bin. 1.20.0 is the
      first that does; earlier releases publish the review skill with an empty
      `bin`. The action checks the unpacked tarball and fails with that
      explanation before installing anything. See README.md.
    required: false
    default: 'latest'
  claude-code-version:
    description: 'Exact version of @anthropic-ai/claude-code to install. Pinned for the same reason as tea-version.'
    required: false
    default: '2.1.220'
  codex-version:
    description: 'Exact version of @openai/codex to install, for `agent: codex`. Pinned for the same reason as tea-version.'
    required: false
    default: '0.146.0'

  # ─── review scope ───────────────────────────────────────────────────────────
  base-ref:
    description: |
      Git ref the changed-test diff is taken against. Defaults to
      origin/<the PR base branch>: read from GITHUB_BASE_REF on a pull_request
      event, and resolved through the pulls API on an issue_comment run, which
      carries no base ref of its own. When neither source can answer (a push
      or dispatch run), origin/main is assumed. A failed API lookup fails the
      step rather than diffing against the wrong base; set this input to
      bypass the lookup. Needs a full-history checkout (fetch-depth: 0).
    required: false
    default: ''
  test-dir:
    description: "test_dir hint passed to the skill. The CLI's own default is 'tests'."
    required: false
    default: ''
  scope:
    description: "review_scope override: 'single', 'directory' or 'suite'. Derived from the review-set size when empty."
    required: false
    default: ''

  # ─── gate policy ────────────────────────────────────────────────────────────
  min-score:
    description: 'Fail when the quality score is below this (0-100). No floor when empty.'
    required: false
    default: ''
  max-critical:
    description: 'Fail when Critical violations exceed this. No cap when empty.'
    required: false
    default: ''
  min-files:
    description: "Fail when fewer than this many files were reviewed. The CLI's own default is 1."
    required: false
    default: ''
  fail-on:
    description: "Weakest recommendation that fails the step: 'request-changes' (the CLI's default) or 'block'."
    required: false
    default: ''

  # ─── TEA config keys ────────────────────────────────────────────────────────
  # Stated rather than left to resolution on purpose. CI installs the skill from
  # a tarball, so no _bmad/tea/config.yaml exists and an unstated key is one the
  # agent settles per run: identical files then get reviewed against different
  # knowledge. Empty means "let the CLI resolve it", which is the documented
  # module default and is correct for most repositories; a contract-testing repo
  # that leaves use-pactjs-utils empty silently loses its pactjs-utils fragments.
  use-playwright-utils:
    description: "Force tea_use_playwright_utils: 'true' or 'false'. Empty leaves the CLI's resolution alone (module default: true)."
    required: false
    default: ''
  use-pactjs-utils:
    description: |
      Force tea_use_pactjs_utils: 'true' or 'false'. Empty leaves the CLI's
      resolution alone (module default: false).

      Set it to 'true' in a repository that does contract testing. Left at the
      default, the review loads the generic contract-testing fragment instead of
      the pactjs-utils set and will not flag a missing determinism gate.
    required: false
    default: ''
  pact-mcp:
    description: "Force tea_pact_mcp: 'mcp' or 'none'. Empty leaves the CLI's resolution alone (module default: none)."
    required: false
    default: ''

  extra-args:
    description: |
      Arguments appended to the tea-test-review command verbatim, for flags this
      action does not model: --files, --test-glob, --timeout-ms, --fail-on-skip,
      --waive/--waive-until, --isolate/--no-isolate, --env-pass. Use agent-args
      for selected-agent configuration.
      Quoted like a shell argument list, e.g.
      --waive "flaky suite, ticket FP-1234" --waive-until 2026-09-30
    required: false
    default: ''

  # ─── output files ───────────────────────────────────────────────────────────
  report-path:
    description: 'Where the agent writes the markdown report, relative to the workspace.'
    required: false
    default: 'test-review.md'
  json-path:
    description: 'Where the CLI writes the machine-readable verdict, relative to the workspace.'
    required: false
    default: 'test-review.json'
  upload-report:
    description: |
      Upload report-path and json-path as the tea-test-review-<job> artifact on
      the workflow run, even when the verdict fails, so a report too large to
      inline in the PR comment is still recoverable after the runner is
      deleted. Set to 'false' to manage artifacts yourself.
    required: false
    default: 'true'

  # ─── PR comment ─────────────────────────────────────────────────────────────
  comment:
    description: |
      Publish the verdict as a PR comment, upserted on a hidden marker so a
      pushed commit updates one comment instead of appending another. Needs
      `pull-requests: write`. Silently does nothing when there is no pull request
      in context.

      A comment that cannot be posted is a warning, never a failure: the verdict
      is the step's exit code, and losing the comment must not turn a passing
      review red or a failing one green.
    required: false
    default: 'true'
  github-token:
    description: 'Token used to read and write the PR comment. Needs pull-requests: write.'
    required: false
    default: '${{ github.token }}'
  github-api-url:
    description: 'GitHub API base URL. Set automatically; override only for GHES.'
    required: false
    default: '${{ github.api_url }}'

# Every output must name its source step. A composite action's outputs are
# empty unless each one is wired here, and the test suite pins this 1:1.
outputs:
  recommendation:
    description: "'Approve', 'Approve with Comments', 'Request Changes' or 'Block'. Empty on a skipped review."
    value: ${{ steps.review.outputs.recommendation }}
  quality-score:
    description: 'Quality score out of 100. Empty on a skipped review.'
    value: ${{ steps.review.outputs.quality-score }}
  critical:
    description: 'Critical violation count.'
    value: ${{ steps.review.outputs.critical }}
  high:
    description: 'High violation count.'
    value: ${{ steps.review.outputs.high }}
  medium:
    description: 'Medium violation count.'
    value: ${{ steps.review.outputs.medium }}
  low:
    description: 'Low violation count.'
    value: ${{ steps.review.outputs.low }}
  reviewed-files:
    description: 'Number of files the report says it reviewed. This is the manifest --min-files evaluates, not the diff size.'
    value: ${{ steps.review.outputs.reviewed-files }}
  skipped:
    description: "'true' when there were no changed test files to review. A skip and a pass both exit 0, so this is the only way to tell them apart."
    value: ${{ steps.review.outputs.skipped }}
  report-path:
    description: 'Workspace-relative path of the markdown report, also uploaded as the tea-test-review-<job> artifact.'
    value: ${{ steps.review.outputs.report-path }}
  json-path:
    description: 'Workspace-relative path of the verdict JSON.'
    value: ${{ steps.review.outputs.json-path }}

# Composite rather than a node24 JavaScript action for one reason: a JavaScript
# action is a single main.js run and cannot have steps, and the report upload
# below needs one. The trade-off is that composite steps run on the image's
# node, so setup-node pins back the runtime the node24 form guaranteed.
runs:
  using: composite
  steps:
    - name: Set up node
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # Owned so the caller never writes the ref expression: an issue_comment
    # run starts on the default branch, and the review there would judge the
    # wrong tree. github.sha is the merge commit on pull_request and the
    # triggering commit everywhere else. clean: false so work an earlier step
    # left in the workspace survives. Skipped on a plain-issue comment: no
    # refs/pull/<n>/merge exists for one, and main.js reports the skip.
    - name: Check out the code under review
      if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.sha }}
        fetch-depth: 0 # the review diffs changed test files against the base ref
        persist-credentials: false
        clean: false

    # Codex uses bubblewrap on Linux. GitHub-hosted Ubuntu 24.04 restricts the
    # user namespace bubblewrap needs and otherwise fails every command with
    # `loopback: Failed RTM_NEWADDR`.
    - name: Enable Linux user namespaces for Codex
      if: ${{ inputs.agent == 'codex' && runner.os == 'Linux' && runner.environment == 'github-hosted' }}
      shell: bash
      run: |
        set -euo pipefail

        current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
        if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
          sudo sysctl -w kernel.unprivileged_userns_clone=1
        fi

        current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
        if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi

    # Composite run steps get no automatic INPUT_* variables the way a
    # JavaScript action does, so every declared input is mapped by hand. The
    # test suite pins this mapping 1:1 against the inputs block above: an
    # unmapped input would silently always be its default.
    - name: Run the review
      id: review
      shell: bash
      run: node "$GITHUB_ACTION_PATH/main.js"
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_AGENT: ${{ inputs.agent }}
        INPUT_ANTHROPIC-API-KEY: ${{ inputs.anthropic-api-key }}
        INPUT_CLAUDE-CODE-OAUTH-TOKEN: ${{ inputs.claude-code-oauth-token }}
        INPUT_OPENAI-API-KEY: ${{ inputs.openai-api-key }}
        INPUT_AGENT-API-KEY: ${{ inputs.agent-api-key }}
        INPUT_AGENT-KEY-ENV: ${{ inputs.agent-key-env }}
        INPUT_AGENT-PACKAGE: ${{ inputs.agent-package }}
        INPUT_AGENT-COMMAND: ${{ inputs.agent-command }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_AGENT-ARGS: ${{ inputs.agent-args }}
        INPUT_TEA-VERSION: ${{ inputs.tea-version }}
        INPUT_CLAUDE-CODE-VERSION: ${{ inputs.claude-code-version }}
        INPUT_CODEX-VERSION: ${{ inputs.codex-version }}
        INPUT_BASE-REF: ${{ inputs.base-ref }}
        INPUT_TEST-DIR: ${{ inputs.test-dir }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_MIN-SCORE: ${{ inputs.min-score }}
        INPUT_MAX-CRITICAL: ${{ inputs.max-critical }}
        INPUT_MIN-FILES: ${{ inputs.min-files }}
        INPUT_FAIL-ON: ${{ inputs.fail-on }}
        INPUT_USE-PLAYWRIGHT-UTILS: ${{ inputs.use-playwright-utils }}
        INPUT_USE-PACTJS-UTILS: ${{ inputs.use-pactjs-utils }}
        INPUT_PACT-MCP: ${{ inputs.pact-mcp }}
        INPUT_EXTRA-ARGS: ${{ inputs.extra-args }}
        INPUT_REPORT-PATH: ${{ inputs.report-path }}
        INPUT_JSON-PATH: ${{ inputs.json-path }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_GITHUB-API-URL: ${{ inputs.github-api-url }}
        INPUT_UPLOAD-REPORT: ${{ inputs.upload-report }}

    # always(): a failing verdict is exactly when the report matters, and a
    # failed step skips what follows without it. overwrite because two
    # invocations in one job (a dry run, then a live review) share the name,
    # and v4 artifacts are immutable otherwise.
    - name: Upload the report and verdict
      if: always() && inputs.upload-report == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: tea-test-review-${{ github.job }}
        path: |
          ${{ inputs.report-path }}
          ${{ inputs.json-path }}
        if-no-files-found: warn
        overwrite: true
