# Releases the Action in two halves.
#
# Run workflow on main with a bump: the prepare job runs every gate the repository defines and a
# smoke of the Action from this checkout, derives the next exact vX.Y.Z from the published
# releases, and the draft job creates that exact tag and a draft release with generated notes.
# A rerun after main moved moves that draft and its exact tag to the newer commit while the draft
# is unpublished, and regenerates its notes.
#
# Publish the draft with the Marketplace box ticked: the verify job checks the published tag,
# reruns the gates and the smoke on it and waits for the Marketplace to list it, and the promote
# job moves the floating major tag (v1) to the same commit.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Stable version component to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  release:
    types: [published]

permissions: {}

# Dispatches queue in one group. Each published tag has a group of its own, so a later dispatch or
# publication never cancels a pending publication. The promote job has a group per major: one
# promotion of a major runs at a time, and it reads the highest published release of the major
# again right before it moves the tag, so an older release never moves the major back. The group
# queues every pending promotion (`queue: max`), so a late older one never cancels a newer one that
# waits, and verify fails a release that a newer one superseded while it was verified.
concurrency:
  group: tea-test-review-release-${{ github.event.release.tag_name || github.event_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare draft
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release-sha: ${{ github.sha }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Require the default branch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "Run releases from main, got $GITHUB_REF." >&2
            exit 1
          fi

      - name: Run unit tests
        run: node --test tests/*.test.js

      # The composite action from this checkout: the global install of the CLI and agent, the real
      # CLI invocation and its argv, and output mapping, without paying for an agent call. The
      # placeholder credential is never sent anywhere because the final CLI argument selects the
      # no-agent prompt-generation mode.
      - name: Run deterministic consumer smoke
        uses: ./
        with:
          anthropic-api-key: release-smoke-no-agent
          comment: 'false'
          upload-report: 'false'
          min-files: '1'
          extra-args: --agent none --files tests/main.test.js

      - name: Derive the next exact version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          current_tag=$(gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | node scripts/release-version.js latest)

          tag=$(node scripts/release-version.js next "$current_tag" "$BUMP")
          echo "current-tag=$current_tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  draft:
    name: create draft
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the exact tag and draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release-sha }}
        run: |
          set -euo pipefail

          # The exact tag is missing, current at the release commit, or stale at another object.
          tag_state=missing
          created_tag=false
          if ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null); then
            existing_type=$(jq -r '.object.type' <<< "$ref")
            existing_sha=$(jq -r '.object.sha' <<< "$ref")
            if [ "$existing_sha" = "$RELEASE_SHA" ]; then
              tag_state=current
            else
              tag_state=stale
            fi
          fi

          create_exact_tag() {
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$RELEASE_SHA" >/dev/null
            created_tag=true
          }

          move_exact_tag() {
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$1" \
              -F force=true >/dev/null
          }

          verify_exact_tag() {
            local exact_sha
            exact_sha=$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object.sha')
            if [ "$exact_sha" != "$RELEASE_SHA" ]; then
              echo "Tag $TAG points to $exact_sha instead of $RELEASE_SHA." >&2
              return 1
            fi
          }

          validate_draft() {
            local draft_json="$1"
            local actual_draft actual_tag actual_url
            actual_draft=$(jq -r '.isDraft' <<< "$draft_json")
            actual_tag=$(jq -r '.tagName' <<< "$draft_json")
            actual_url=$(jq -r '.url' <<< "$draft_json")

            if [ "$actual_draft" != 'true' ]; then
              echo "Release $TAG already exists and is published at $actual_url." >&2
              return 1
            fi
            if [ "$actual_tag" != "$TAG" ]; then
              echo "Release lookup for $TAG returned tag $actual_tag at $actual_url." >&2
              return 1
            fi
          }

          publish_steps() {
            {
              echo "Draft release: $1"
              echo
              echo '1. Open the draft and click Edit.'
              echo '2. Tick Publish this Action to the GitHub Marketplace. On the first release, accept the agreement and pick a primary category.'
              echo '3. Click Publish release. The Release workflow then moves the major tag on its own.'
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # A rerun after main moved finds the draft and the exact tag an earlier run created at an
          # older commit. Only an unpublished draft this workflow created moves, and its lightweight
          # tag moves with it. Every check runs before the first write, and every read and write after
          # the lookup addresses the draft by its id, so a draft that replaced it in between stays put.
          if release=$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json author,body,databaseId,isDraft,tagName,targetCommitish,url 2>/dev/null); then
            validate_draft "$release"
            release_id=$(jq -r '.databaseId' <<< "$release")
            release_target=$(jq -r '.targetCommitish' <<< "$release")
            release_author=$(jq -r '.author.login' <<< "$release")

            read_release() {
              gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                --jq '{author: {login: .author.login}, isDraft: .draft, tagName: .tag_name, targetCommitish: .target_commitish, url: .html_url}'
            }

            if [ "$release_author" != 'github-actions[bot]' ] \
              && { [ "$tag_state" = 'stale' ] || [ "$release_target" != "$RELEASE_SHA" ]; }; then
              if [ "$tag_state" = 'stale' ]; then
                echo "Tag $TAG already points to $existing_sha instead of $RELEASE_SHA." >&2
              fi
              echo "Draft release $TAG targets $release_target and belongs to $release_author." >&2
              echo "Refusing to retarget a draft that this workflow did not create." >&2
              exit 1
            fi
            if [ "$tag_state" = 'stale' ] && [ "$existing_type" != 'commit' ]; then
              echo "Tag $TAG points to a $existing_type object instead of a commit." >&2
              echo 'Refusing to move a tag that this workflow did not create.' >&2
              exit 1
            fi

            if [ "$tag_state" = 'stale' ]; then
              # A move whose response was lost may still have happened, so the run reads the state back
              # whether the move succeeded or not, and verify_exact_tag below stops a move that did not.
              move_exact_tag "$RELEASE_SHA" || true
              # Release immutability refuses to move the tag of a published release, so a publication
              # before the move keeps the tag where it was. The token cannot read that setting, so a
              # draft that was published, deleted or replaced around the move also shows here: a tag
              # this run moved goes back to the commit it had, and the run stops. A tag someone else
              # moved meanwhile stays where they put it. Immutability refuses the move back for a
              # release published after the move, and the tag then stays with that release.
              moved_release=$(read_release) || moved_release='{}'
              if [ "$(jq -r '.isDraft' <<< "$moved_release")" != 'true' ] \
                || [ "$(jq -r '.tagName' <<< "$moved_release")" != "$TAG" ]; then
                echo "Release $TAG stopped being the draft this run checked while its tag moved from $existing_sha to $RELEASE_SHA." >&2
                current_sha=$(gh api \
                  "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                  --jq '.object.sha' 2>/dev/null) || current_sha=missing
                if [ "$current_sha" = "$RELEASE_SHA" ]; then
                  if move_exact_tag "$existing_sha"; then
                    echo "Tag $TAG is back at $existing_sha." >&2
                  else
                    echo "Tag $TAG could not move back to $existing_sha. Check which commit it belongs on before the next run." >&2
                  fi
                elif [ "$current_sha" = "$existing_sha" ]; then
                  echo "Tag $TAG stays at $existing_sha." >&2
                else
                  echo "Tag $TAG now points to $current_sha, so this run leaves it there." >&2
                fi
                exit 1
              fi
            elif [ "$tag_state" = 'missing' ]; then
              create_exact_tag
            fi
            verify_exact_tag

            # The notes of an existing tag end at that tag, so they are generated once it is in place.
            # Each run compares them, so a rerun after a run that stopped past the tag still updates them.
            if [ "$release_author" = 'github-actions[bot]' ]; then
              release_notes=$(gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                -f tag_name="$TAG" \
                -f target_commitish="$RELEASE_SHA" \
                --jq '.body')
              if [ "$release_target" != "$RELEASE_SHA" ] \
                || [ "$release_notes" != "$(jq -r '.body' <<< "$release")" ]; then
                release_notes_file="$RUNNER_TEMP/$TAG-release-notes.md"
                printf '%s\n' "$release_notes" > "$release_notes_file"
                gh api \
                  --method PATCH \
                  "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                  -f tag_name="$TAG" \
                  -f target_commitish="$RELEASE_SHA" \
                  -f name="$TAG" \
                  -F body=@"$release_notes_file" >/dev/null
              fi
            fi

            release=$(read_release)
            validate_draft "$release"
            release_target=$(jq -r '.targetCommitish' <<< "$release")
            if [ "$release_target" != "$RELEASE_SHA" ]; then
              echo "Draft $TAG targets $release_target instead of $RELEASE_SHA." >&2
              exit 1
            fi
            url=$(jq -r '.url' <<< "$release")
            echo 'This run found the draft an earlier run created.' >> "$GITHUB_STEP_SUMMARY"
            publish_steps "$url"
            exit 0
          fi

          if [ "$tag_state" = 'stale' ]; then
            echo "Tag $TAG already points to $existing_sha instead of $RELEASE_SHA." >&2
            echo 'No draft release of this workflow owns it, so it stays where it is.' >&2
            exit 1
          fi
          if [ "$tag_state" = 'missing' ]; then
            create_exact_tag
          fi

          # Let the Releases API create a draft for the exact, existing tag.
          # Draft URLs use an untagged-* slug until publication by design.
          if ! url=$(gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$RELEASE_SHA" \
            --generate-notes \
            --title "$TAG"); then
            if [ "$created_tag" = 'true' ] && ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if cleanup_sha=$(gh api \
                "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                --jq '.object.sha' 2>/dev/null) \
                && [ "$cleanup_sha" = "$RELEASE_SHA" ]; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true
              fi
            fi
            exit 1
          fi

          if ! created_release=$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json author,isDraft,tagName,targetCommitish,url); then
            echo "Release creation returned $url, but no release is bound to $TAG." >&2
            exit 1
          fi

          validate_draft "$created_release"
          created_url=$(jq -r '.url' <<< "$created_release")
          if [ "$created_url" != "$url" ]; then
            echo "Release creation returned $url, but $TAG resolves to $created_url." >&2
            exit 1
          fi
          verify_exact_tag

          publish_steps "$url"

  verify:
    name: verify published release
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      major: ${{ steps.release.outputs.major }}
      release-sha: ${{ steps.release.outputs.release-sha }}
      current: ${{ steps.order.outputs.current }}
    steps:
      - name: Check out the published release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      # Validate the ref against main before executing any repository code.
      - name: Validate the immutable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match vX.Y.Z, got $TAG." >&2
            exit 1
          fi

          major="${TAG%%.*}"
          release_sha=$(git rev-list -n 1 "$TAG")

          git fetch --no-tags origin +main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "Release $TAG points outside main: $release_sha" >&2
            exit 1
          fi

          node scripts/release-version.js validate "$TAG" >/dev/null
          test "$(node scripts/release-version.js major "$TAG")" = "$major"

          immutable=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)
          if [ "$immutable" != 'true' ]; then
            echo "Release $TAG is mutable. Enable immutable releases before promotion." >&2
            {
              echo "$TAG was published while release immutability was off, so $major stays put."
              echo 'Turn on Settings, General, Releases, Enable release immutability, then release the next patch.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/contents/action.yml?ref=$TAG" --jq .sha >/dev/null

          highest_tag=$(gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | awk -v prefix="$major." 'index($0, prefix) == 1' \
            | node scripts/release-version.js latest)
          release_order=$(node scripts/release-version.js compare "$TAG" "$highest_tag")

          if [ "$release_order" -lt 0 ]; then
            echo "$TAG is older than the highest published $major release, $highest_tag." >&2
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "major=$major"
            echo "release-sha=$release_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: node --test tests/*.test.js

      # The composite action from the published tag: the global install of the CLI and agent, the real
      # CLI invocation and its argv, and output mapping, without paying for an agent call. The
      # placeholder credential is never sent anywhere because the final CLI argument selects the
      # no-agent prompt-generation mode.
      - name: Run deterministic consumer smoke
        uses: ./
        with:
          anthropic-api-key: release-smoke-no-agent
          comment: 'false'
          upload-report: 'false'
          min-files: '1'
          extra-args: --agent none --files tests/main.test.js

      - name: Verify Marketplace publication
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          marketplace_page="$RUNNER_TEMP/tea-test-review-marketplace.html"
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location --max-time 30 \
              --output "$marketplace_page" \
              'https://github.com/marketplace/actions/tea-test-review' \
              && grep --fixed-strings --word-regexp --quiet "$TAG" "$marketplace_page"; then
              exit 0
            fi
            echo "Marketplace check $attempt of 24 did not find $TAG." >&2
            sleep 5
          done

          echo "Marketplace does not list $TAG. Confirm the release checkbox was selected." >&2
          {
            echo "The Marketplace does not list $TAG, so the major tag stays put."
            echo "Open the $TAG release, click Edit, tick Publish this Action to the GitHub Marketplace, click Update release, then re-run this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # The gates and the Marketplace wait take minutes, and a newer release of the major may have
      # been published meanwhile. A superseded release fails here, so it never queues a promotion.
      # The promote step reads the order once more before it moves the tag.
      - name: Recheck the release order
        id: order
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          MAJOR: ${{ steps.release.outputs.major }}
        run: |
          set -euo pipefail

          highest_tag=$(gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | awk -v prefix="$MAJOR." 'index($0, prefix) == 1' \
            | node scripts/release-version.js latest)
          release_order=$(node scripts/release-version.js compare "$TAG" "$highest_tag")

          if [ "$release_order" -lt 0 ]; then
            echo "$TAG was superseded by $highest_tag while it was verified, so $MAJOR stays with the newer release." >&2
            echo "$highest_tag superseded $TAG while it was verified, so $MAJOR stays with $highest_tag." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo 'current=true' >> "$GITHUB_OUTPUT"

  promote:
    name: promote floating major
    if: github.event_name == 'release' && github.event.action == 'published' && needs.verify.outputs.current == 'true'
    needs: verify
    concurrency:
      group: tea-test-review-promote-${{ needs.verify.outputs.major }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Move the floating major tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          MAJOR: ${{ needs.verify.outputs.major }}
          RELEASE_SHA: ${{ needs.verify.outputs.release-sha }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local ref_name="$1"
            local object_type object_sha

            read -r object_type object_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$ref_name" \
                --jq '.object | [.type, .sha] | @tsv'
            )

            while [ "$object_type" = 'tag' ]; do
              read -r object_type object_sha < <(
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                  --jq '.object | [.type, .sha] | @tsv'
              )
            done

            if [ "$object_type" != 'commit' ]; then
              echo "Tag $ref_name resolves to $object_type instead of a commit." >&2
              return 1
            fi

            printf '%s\n' "$object_sha"
          }

          exact_sha=$(resolve_tag_commit "$TAG")
          if [ "$exact_sha" != "$RELEASE_SHA" ]; then
            echo "$TAG resolves to $exact_sha instead of $RELEASE_SHA." >&2
            exit 1
          fi

          # This job's concurrency group runs one promotion of the major at a time, so the highest
          # published release of the major read here still holds when the tag moves below. A release
          # published after verify read the order, and promoted first, keeps the major.
          # A failed read stops the step here, before any tag moves.
          published=$(gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          newest_tag=$(printf '%s\n%s\n' "$published" "$TAG" \
            | awk -v prefix="$MAJOR." 'index($0, prefix) == 1 && /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/' \
            | sort -t . -k 2,2n -k 3,3n \
            | tail -n 1)
          if [ "$newest_tag" != "$TAG" ]; then
            echo "$TAG is older than $newest_tag, the highest published $MAJOR release, so $MAJOR stays put." >&2
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$MAJOR" >/dev/null 2>&1; then
            major_sha=$(resolve_tag_commit "$MAJOR")
            if [ "$major_sha" = "$RELEASE_SHA" ]; then
              echo "$MAJOR already resolves to $RELEASE_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR" \
              -f sha="$RELEASE_SHA" \
              -F force=true >/dev/null
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$MAJOR" \
              -f sha="$RELEASE_SHA" >/dev/null
          fi

      - name: Verify exact and floating references
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          MAJOR: ${{ needs.verify.outputs.major }}
          RELEASE_SHA: ${{ needs.verify.outputs.release-sha }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local ref_name="$1"
            local object_type object_sha

            read -r object_type object_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$ref_name" \
                --jq '.object | [.type, .sha] | @tsv'
            )

            while [ "$object_type" = 'tag' ]; do
              read -r object_type object_sha < <(
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                  --jq '.object | [.type, .sha] | @tsv'
              )
            done

            if [ "$object_type" != 'commit' ]; then
              echo "Tag $ref_name resolves to $object_type instead of a commit." >&2
              return 1
            fi

            printf '%s\n' "$object_sha"
          }

          exact_sha=$(resolve_tag_commit "$TAG")
          major_sha=$(resolve_tag_commit "$MAJOR")

          test "$exact_sha" = "$RELEASE_SHA"
          test "$major_sha" = "$RELEASE_SHA"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/contents/action.yml?ref=$MAJOR" --jq .sha >/dev/null
          curl --fail --silent --show-error --location --max-time 30 \
            "https://github.com/$GITHUB_REPOSITORY/tree/$MAJOR" >/dev/null

          echo "$TAG and $MAJOR both resolve to $RELEASE_SHA. Nothing left to click." >> "$GITHUB_STEP_SUMMARY"
